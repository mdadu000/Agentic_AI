<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chat — Web App</title>
  <!-- FIX: Correct paths to CSS files -->
  <link rel="stylesheet" href="/static/main.css" />
  <link rel="stylesheet" href="/static/chat.css" />
  <!-- Font Awesome (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
  <header>
    <div class="header-container">
      <div class="logo">
        <i class="fa-solid logo-img fa-utensils"></i>
        <h1>EasyDine</h1>
      </div>
      <nav>
        <ul class="nav-links">
          <!-- FIX: Correct link back to home -->
          <li><a href="/">Home</a></li>
          <li><a href="#">Chat</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="chat-page">
    <aside class="sessions-container">
      <h3 class="session-title">Sessions</h3>
      <button class="create-session-button" id="new-session">
        <i class="fa fa-plus"></i> New Session
      </button>
      <ul id="sessions-list" class="sessions-list"></ul>
    </aside>
    <section class="chat-container" aria-label="Chat">
      <div id="messages" class="messages" role="log" aria-live="polite"></div>

      <!-- <div id="file-drop" class="file-drop">
          Drop files here or click to attach
        </div> -->

      <form id="chat-form" class="chat-form" autocomplete="off">
        <div id="file-preview" class="file-preview"></div>
        <div class="input-group">
          <label for="file-input" class="attach-btn">
            <i class="fa fa-paperclip"></i>
          </label>
          <input id="file-input" type="file" name="file" aria-label="Attach file" hidden />
          <textarea id="message-input" placeholder="Type your message..." rows="1"></textarea>
          <button id="send-btn" type="submit">
            <i class="fa fa-paper-plane"></i>
          </button>
        </div>
      </form>
    </section>
  </main>

  <!-- FIX: Correct paths to JS files -->
  <script type="module" src="/static/chat.js"></script>
  <script type"module" src="/static/apiService.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</body>

</html>
